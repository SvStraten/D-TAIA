[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d-taia"
version = "0.1.0"
description = "D-TAIA: Domain-Aware LLM Adaptation for Multi-Task Predictive Process Monitoring"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentencepiece>=0.1.99",
    "peft>=0.10",
    "faiss-cpu>=1.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pm4py>=2.7",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["d_taia*"]